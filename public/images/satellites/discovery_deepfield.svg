<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="neb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0077" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#00dfd8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#030008"/>
  <rect width="600" height="400" fill="url(#neb)"/>

  <!-- Gravitational Lens Arc & Spiral Galaxies -->
  <g fill="none" stroke="#00e5ff" opacity="0.6">
    <ellipse cx="300" cy="200" rx="180" ry="120" stroke-width="1.5" stroke-dasharray="10,5"/>
    <path d="M 180 200 Q 300 120 420 200" stroke-width="2.5" stroke="#ffcc00"/>
    <path d="M 220 240 Q 300 290 380 240" stroke-width="2.5" stroke="#ff3366"/>
  </g>

  <!-- Thousands of High Redshift Galaxies Dots & Diffraction Spikes -->
  <g fill="#ffffff">
    <circle cx="300" cy="200" r="4" fill="#fff"/>
    <line x1="300" y1="180" x2="300" y2="220" stroke="#fff" stroke-width="1"/>
    <line x1="280" y1="200" x2="320" y2="200" stroke="#fff" stroke-width="1"/>

    <circle cx="150" cy="100" r="3" fill="#ffb700"/>
    <circle cx="450" cy="80" r="2.5" fill="#00e5ff"/>
    <circle cx="120" cy="300" r="3.5" fill="#ff3366"/>
    <circle cx="500" cy="320" r="2" fill="#a855f7"/>
    <circle cx="220" cy="80" r="1.5"/>
    <circle cx="380" cy="350" r="2"/>
    <circle cx="80" cy="220" r="1.8"/>
    <circle cx="520" cy="180" r="2"/>
  </g>

  <text x="20" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#00e5ff" letter-spacing="1">DEEP FIELD COSMIC DISCOVERY</text>
  <text x="20" y="385" font-family="monospace" font-size="9" fill="#94a3b8">EARLIEST GALAXIES AFTER THE BIG BANG (z &gt; 12)</text>
</svg>
