<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18002e"/>
      <stop offset="50%" stop-color="#090014"/>
      <stop offset="100%" stop-color="#020005"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Pillars of Creation Gas Columns -->
  <path d="M 120 400 C 140 250 160 180 190 120 C 210 80 240 100 230 150 C 220 200 280 220 270 280 C 260 340 300 400 300 400 Z" fill="url(#pillar)" stroke="#ffb700" stroke-width="1.5"/>
  <path d="M 280 400 C 300 300 320 220 340 170 C 360 140 380 160 370 200 C 360 250 410 320 420 400 Z" fill="url(#pillar)" opacity="0.85" stroke="#ff3366" stroke-width="1"/>
  <path d="M 410 400 C 430 340 450 280 470 250 C 485 230 500 245 495 275 C 490 310 520 370 530 400 Z" fill="url(#pillar)" opacity="0.7"/>

  <!-- EVI (Evaporating Gaseous Globules) Glowing Tips -->
  <circle cx="190" cy="120" r="10" fill="#00e5ff" filter="blur(2px)"/>
  <circle cx="190" cy="120" r="4" fill="#ffffff"/>
  <circle cx="340" cy="170" r="8" fill="#ffcc00" filter="blur(2px)"/>
  <circle cx="340" cy="170" r="3" fill="#ffffff"/>

  <!-- Embedded Proto-Stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="250" cy="50" r="2"/>
    <circle cx="520" cy="90" r="2.5"/>
    <circle cx="70" cy="280" r="1.2"/>
  </g>

  <text x="20" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#ffb700" letter-spacing="1">PILLARS OF CREATION</text>
  <text x="20" y="385" font-family="monospace" font-size="9" fill="#94a3b8">STAR FORMATION IN EAGLE NEBULA (M16)</text>
</svg>
