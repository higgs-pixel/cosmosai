<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#03050d"/>
    </linearGradient>
    <radialGradient id="nebula" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#b38600"/>
      <stop offset="100%" stop-color="#4d3b00"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="50%" stop-color="#80b3cc"/>
      <stop offset="100%" stop-color="#334d5c"/>
    </linearGradient>
  </defs>

  <!-- Background & Nebula -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#nebula)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="100" cy="80" r="1" opacity="0.8"/>
    <circle cx="250" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="420" cy="90" r="1" opacity="0.6"/>
    <circle cx="680" cy="60" r="2" opacity="0.9"/>
    <circle cx="730" cy="180" r="1" opacity="0.7"/>
    <circle cx="150" cy="320" r="1.5" opacity="0.8"/>
    <circle cx="50" cy="450" r="1" opacity="0.5"/>
    <circle cx="620" cy="420" r="1" opacity="0.7"/>
    <circle cx="750" cy="380" r="1.5" opacity="0.9"/>
  </g>

  <!-- Grid lines backdrop -->
  <path d="M 0 250 L 800 250 M 400 0 L 400 500" stroke="#00e5ff" stroke-width="0.5" opacity="0.15" stroke-dasharray="4,4"/>

  <!-- HUBBLE SPACE TELESCOPE BODY -->
  <g transform="translate(400,240) rotate(-12) scale(1.1)">
    <!-- Aperture Door Open -->
    <path d="M -160 -45 L -190 -85 L -150 -95 L -130 -50 Z" fill="url(#silver)" stroke="#00e5ff" stroke-width="1"/>

    <!-- Main Metallic Cylinder -->
    <rect x="-140" y="-45" width="220" height="90" rx="6" fill="url(#silver)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Aft Shroud (Darker Segment) -->
    <rect x="80" y="-48" width="80" height="96" rx="4" fill="#1e293b" stroke="#00e5ff" stroke-width="1"/>

    <!-- Primary Mirror / Internal Optical Tube Glow -->
    <ellipse cx="-135" cy="0" rx="6" ry="40" fill="#00e5ff" opacity="0.8"/>

    <!-- Solar Panels Left & Right -->
    <!-- Top Panel -->
    <rect x="-30" y="-195" width="50" height="140" fill="url(#solar)" stroke="#ffcc00" stroke-width="1.5" rx="2"/>
    <line x1="-30" y1="-125" x2="20" y2="-125" stroke="#000" stroke-width="1"/>
    <line x1="-30" y1="-160" x2="20" y2="-160" stroke="#000" stroke-width="1"/>
    <line x1="-5" y1="-195" x2="-5" y2="-55" stroke="#000" stroke-width="1"/>
    <line x1="-5" y1="-55" x2="-5" y2="-45" stroke="#94a3b8" stroke-width="4"/>

    <!-- Bottom Panel -->
    <rect x="-30" y="55" width="50" height="140" fill="url(#solar)" stroke="#ffcc00" stroke-width="1.5" rx="2"/>
    <line x1="-30" y1="125" x2="20" y2="125" stroke="#000" stroke-width="1"/>
    <line x1="-30" y1="160" x2="20" y2="160" stroke="#000" stroke-width="1"/>
    <line x1="-5" y1="55" x2="-5" y2="195" stroke="#000" stroke-width="1"/>
    <line x1="-5" y1="45" x2="-5" y2="55" stroke="#94a3b8" stroke-width="4"/>

    <!-- High Gain Antennas -->
    <path d="M 120 -48 L 160 -90" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="165" cy="-95" r="10" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M 120 48 L 160 90" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="165" cy="95" r="10" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

    <!-- Lens Flare Beam -->
    <polygon points="-140,0 -400,-120 -400,120" fill="url(#nebula)" opacity="0.6"/>
  </g>

  <!-- Overlay HUD Text -->
  <text x="30" y="450" font-family="monospace" font-size="14" font-weight="bold" fill="#00e5ff" letter-spacing="2">HUBBLE SPACE TELESCOPE (HST)</text>
  <text x="30" y="470" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">NASA / ESA 2.4M OPTICAL OBSERVATORY • LEO 538 KM</text>
</svg>
