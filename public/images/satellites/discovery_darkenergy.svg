<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="nova" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#020617"/>
  <rect width="600" height="400" fill="url(#nova)"/>

  <!-- Supernova Type Ia Burst Spikes -->
  <g stroke="#38bdf8" stroke-width="2">
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="150" y1="200" x2="450" y2="200"/>
    <line x1="194" y1="94" x2="406" y2="306"/>
    <line x1="194" y1="306" x2="406" y2="94"/>
  </g>

  <!-- Expanding Shockwave Rings -->
  <circle cx="300" cy="200" r="80" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
  <circle cx="300" cy="200" r="140" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.6"/>

  <text x="20" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="1">ACCELERATING EXPANSION &amp; DARK ENERGY</text>
  <text x="20" y="385" font-family="monospace" font-size="9" fill="#94a3b8">NOBEL PRIZE DISCOVERY VIA TYPE IA SUPERNOVAE MEASUREMENTS</text>
</svg>
