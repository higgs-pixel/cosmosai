<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Starlink Megaconstellation Multiple Satellites Line -->
  <g opacity="0.6">
    <line x1="-50" y1="100" x2="850" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,12"/>
    <circle cx="150" cy="142" r="3" fill="#38bdf8"/>
    <circle cx="270" cy="168" r="3" fill="#38bdf8"/>
    <circle cx="510" cy="218" r="3" fill="#38bdf8"/>
    <circle cx="630" cy="242" r="3" fill="#38bdf8"/>
  </g>

  <!-- Main Starlink V1.0 Flat-Panel Craft -->
  <g transform="translate(390,190) rotate(12)">
    <!-- Flat Chassis -->
    <rect x="-80" y="-12" width="160" height="24" fill="#334155" stroke="#38bdf8" stroke-width="1.5" rx="3"/>
    
    <!-- Phased Array Antennas -->
    <rect x="-70" y="-8" width="45" height="16" fill="#0284c7" opacity="0.8"/>
    <rect x="-15" y="-8" width="45" height="16" fill="#0284c7" opacity="0.8"/>
    <rect x="40" y="-8" width="30" height="16" fill="#38bdf8" opacity="0.9"/>

    <!-- Single Folded Solar Array Panel extending Upwards -->
    <rect x="-30" y="-220" width="60" height="208" fill="#eab308" stroke="#facc15" stroke-width="1.5" rx="2"/>
    <line x1="-30" y1="-160" x2="30" y2="-160" stroke="#000" stroke-width="1"/>
    <line x1="-30" y1="-100" x2="30" y2="-100" stroke="#000" stroke-width="1"/>
    <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#000" stroke-width="1"/>

    <!-- Laser Link Beams -->
    <line x1="-80" y1="0" x2="-250" y2="-36" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="80" y1="0" x2="250" y2="36" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Downlink Broadband Cone -->
    <polygon points="0,12 -220,240 220,240" fill="url(#beam)"/>
  </g>

  <!-- Text Overlay -->
  <text x="30" y="450" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" letter-spacing="2">STARLINK BROADBAND CONSTELLATION (SPACEX)</text>
  <text x="30" y="470" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">LOW EARTH ORBIT BROADBAND MEGACONSTELLATION • LEO 550 KM</text>
</svg>
